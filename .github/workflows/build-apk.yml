name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Install TypeScript
        run: npm install -D typescript

      - name: Prepare web files
        run: |
          mkdir -p www/assets
          cp index.html style.css app.js manifest.json sw.js www/
          cp icon-192.png icon-512.png icon.svg www/assets/ 2>/dev/null || true
          cp icon-192.png icon-512.png icon.svg www/ 2>/dev/null || true

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Jothidar-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
